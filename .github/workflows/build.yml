
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          if [ ! -f source/settings.gradle ] && [ ! -f source/settings.gradle.kts ]; then
            echo "ERROR: settings.gradle not found at source root"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Install Gradle 8.9
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build APK
        run: |
          /tmp/gradle-8.9/bin/gradle -p source --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImmersiveRouletteAI-NEW-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
