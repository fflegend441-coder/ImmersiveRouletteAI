
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract updated Android project
        run: |
          unzip -q ImmersiveRouletteAI_OCR_HISTORY_FIXED.zip -d source

      - name: Install Gradle 8.9
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build Debug APK
        run: |
          /tmp/gradle-8.9/bin/gradle -p source --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImmersiveRouletteAI-OCR-FIXED-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
